# Local infrastructure for development: PostgreSQL (primary database) and
# Redis (optional, used for multi-instance rate limiting).
#
#   docker compose up -d      # start
#   docker compose down       # stop (data is kept in named volumes)
#   docker compose down -v    # stop and delete all data

services:
  db:
    image: postgres:16
    container_name: rodovo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rodovo
      POSTGRES_PASSWORD: rodovo
      POSTGRES_DB: rodovo
    ports:
      - "5432:5432"
    volumes:
      - rodovo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rodovo -d rodovo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: rodovo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rodovo_redisdata:/data

volumes:
  rodovo_pgdata:
  rodovo_redisdata:
